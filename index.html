<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B6914">
<meta name="description" content="Three Questions — Leo Tolstoy | Interactive bilingual educational PWA">
<title>Three Questions — Leo Tolstoy</title>
<link rel="manifest" href="manifest.json">
<style>
  body { margin:0; font-family: Georgia, serif; background:#1a120b; color:#d4af37;
    display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .loader { text-align:center; padding:2rem; }
  .spinner { width:40px; height:40px; border:3px solid rgba(212,175,55,0.3);
    border-top-color:#d4af37; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Loading Three Questions…</p>
</div>
<script>
(function() {
  const b64 = "PLACEHOLDER_WILL_REPLACE";
  function b64ToBytes(s) {
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function inflate(bytes) {
    if (typeof DecompressionStream !== 'undefined') {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }
    throw new Error('Browser does not support DecompressionStream. Please use Chrome, Edge, Firefox, or Safari.');
  }
  async function boot() {
    try {
      const bytes = b64ToBytes(b64);
      const html = await inflate(bytes);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('loader').innerHTML =
        '<p style="color:#f44336">Failed to load app.</p><p style="font-size:14px;color:#a89880">' +
        (e && e.message ? e.message : e) + '</p>';
      console.error(e);
    }
  }
  boot();
})();
</script>
</body>
</html>
