<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B6914">
<meta name="description" content="Three Questions — Leo Tolstoy | Interactive bilingual educational PWA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Three Questions — Leo Tolstoy</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font-family:Georgia,serif;background:#1a120b;color:#d4af37;display:flex;align-items:center;justify-content:center;min-height:100vh}
.loader{text-align:center;padding:2rem}
.spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,.3);border-top-color:#d4af37;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="spinner"></div><p>Loading Three Questions…</p></div>
<script>
(async function(){
  try{
    const [r1,r2] = await Promise.all([fetch('app.b64.1?v=2'), fetch('app.b64.2?v=2')]);
    if(!r1.ok||!r2.ok) throw new Error('Failed to fetch app data');
    const b64 = ((await r1.text())+(await r2.text())).trim();
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined')
      throw new Error('Please use Chrome, Edge, Firefox or Safari.');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loader').innerHTML =
      '<p style="color:#f44336">Failed to load.</p><p style="font-size:14px;color:#a89880">'+(e.message||e)+'</p>';
  }
})();
</script>
</body>
</html>
