/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg: #f7f1e8;
  --bg-paper: #faf6f0;
  --text: #2c2416;
  --text-muted: #6b5d4d;
  --accent: #8B6914;
  --accent-light: #c9a227;
  --gold: #d4af37;
  --card: #ffffff;
  --border: #e0d5c5;
  --highlight: rgba(212,175,55,0.35);
  --highlight-word: rgba(139,105,20,0.45);
  --shadow: 0 4px 20px rgba(44,36,22,0.08);
  --radius: 12px;
  --font-size: 17px;
  --line-height: 1.75;
  --max-width: 720px;
  --nav-h: 56px;
  --player-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #1a120b;
  --bg-paper: #241a12;
  --text: #f0e6d6;
  --text-muted: #a89880;
  --card: #2c2118;
  --border: #3d3025;
  --shadow: 0 4px 20px rgba(0,0,0,0.35);
  --highlight: rgba(212,175,55,0.25);
  --highlight-word: rgba(212,175,55,0.4);
}
[data-theme="sepia"] {
  --bg: #f4ecd8;
  --bg-paper: #f8f1e0;
  --text: #5c4b32;
  --text-muted: #8a7660;
  --card: #faf6eb;
  --border: #e5d9c0;
}
[data-theme="contrast"] {
  --bg: #000;
  --bg-paper: #111;
  --text: #fff;
  --text-muted: #ccc;
  --card: #1a1a1a;
  --border: #444;
  --accent: #ffd700;
  --highlight: rgba(255,215,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family: Georgia, 'Times New Roman', serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--font-size);
  line-height: var(--line-height);
  min-height: 100vh;
  padding-bottom: calc(var(--player-h) + var(--safe-bottom) + 16px);
  transition: background .3s, color .3s;
}
button,input,select{font-family:inherit}
a{color:var(--accent)}
img{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
